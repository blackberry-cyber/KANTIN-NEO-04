<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANTIN NEO 04</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-gradient-to-r from-blue-900 to-indigo-950 text-white py-6 shadow-md text-center rounded-b-3xl border-b-4 border-yellow-500">
        <h1 class="text-3xl font-bold tracking-wide flex justify-center items-center gap-2 text-yellow-400">
            <i class="fas fa-utensils"></i> KANTIN NEO 04
        </h1>
        <p class="text-xs opacity-90 mt-1 uppercase tracking-widest text-slate-200">Kantin Kampus UMP Modern</p>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow max-w-md md:max-w-xl">
        
        <div id="login" class="screen flex flex-col gap-4 justify-center items-center my-12">
            <div class="text-center mb-4">
                <i class="fas fa-university text-6xl text-blue-900 mb-2"></i>
                <h3 class="text-lg font-semibold text-slate-700">Silakan Masuk Sebagai:</h3>
            </div>
            <button class="w-full bg-blue-900 hover:bg-blue-950 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-3 text-lg" onclick="login('pembeli')">
                <i class="fas fa-shopping-basket text-yellow-400"></i> Pembeli / Pelanggan
            </button>
            <button class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-3 text-lg" onclick="login('penjual')">
                <i class="fas fa-user-shield text-yellow-400"></i> Owner / Penjual
            </button>
        </div>

        <div id="pembeli" class="screen hidden">
            <div class="flex items-center gap-3 mb-6">
                <button class="bg-slate-200 hover:bg-slate-300 text-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition" onclick="kembali()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h2 class="text-xl font-bold text-slate-700">Daftar Menu Makanan</h2>
            </div>
            
            <div id="menu" class="grid grid-cols-1 gap-4 mb-24"></div>

            <div id="qr" class="flex justify-center my-4"></div>

            <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-50">
                <div class="max-w-md mx-auto flex justify-between items-center gap-4">
                    <div>
                        <p class="text-xs text-slate-400 uppercase font-semibold tracking-wider">Total Belanja</p>
                        <span id="total" class="text-2xl font-bold text-blue-900">Rp 0</span>
                    </div>
                    <button class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition flex items-center gap-2" onclick="bayar()">
                        Bayar <i class="fas fa-chevron-right text-xs text-yellow-300"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="penjual" class="screen hidden">
            <div class="flex items-center gap-3 mb-6">
                <button class="bg-slate-200 hover:bg-slate-300 text-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition" onclick="kembali()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h2 class="text-xl font-bold text-slate-700">Dashboard Owner</h2>
            </div>

            <div class="grid grid-cols-3 gap-2 bg-slate-200 p-1.5 rounded-xl mb-6">
                <button id="tab-menu" class="bg-white text-slate-800 font-medium py-2 px-3 rounded-lg text-sm shadow-sm transition flex items-center justify-center gap-2" onclick="showMenu()">
                    <i class="fas fa-tasks text-blue-900"></i> Menu
                </button>
                <button id="tab-laporan" class="text-slate-600 hover:text-slate-800 font-medium py-2 px-3 rounded-lg text-sm transition flex items-center justify-center gap-2" onclick="showLaporan()">
                    <i class="fas fa-chart-bar text-indigo-600"></i> Laporan
                </button>
                <button class="bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2 px-3 rounded-lg text-sm shadow transition flex items-center justify-center gap-2" onclick="downloadExcel()">
                    <i class="fas fa-file-excel text-yellow-300"></i> Unduh
                </button>
            </div>

            <div id="content" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 min-h-[250px]"></div>
        </div>

    </main>

    <footer class="text-center py-4 text-xs text-slate-400 mt-8">
        &copy; 2026 Kantin Neo 04 UMP. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
